{% extends "admin/index.html" %}
{% load gm_admin %}

{% block content %}
{% todo_items as todo %}
<div class="module" style="margin-bottom:24px">
	<h2>À traiter</h2>
	{% if todo %}
		<ul style="margin:12px 16px;padding:0;list-style:none;font-size:1.05rem;line-height:2">
			{% for item in todo %}
				<li><a href="{{ item.url }}"><b style="color:#8a2b22">{{ item.count }}</b> {{ item.label }}</a></li>
			{% endfor %}
		</ul>
	{% else %}
		<p style="margin:12px 16px">Rien à traiter pour le moment.</p>
	{% endif %}
</div>
{{ block.super }}
{% endblock %}
