# /etc/nginx/sites-available/gm  (symlinked into sites-enabled by setup.sh)
# certbot adds the HTTPS (443) server block and the http→https redirect automatically.

upstream gm_django {
	server unix:/run/gm/gunicorn.sock fail_timeout=0;
}

server {
	listen 80;
	listen [::]:80;
	server_name gmfuneraire.fr www.gmfuneraire.fr;

	# the static website (copied from the repo by deploy.sh, without the server/ folder)
	root /srv/gm/www;
	index index.html;
	charset utf-8;
	client_max_body_size 50m;  # up to 3 phone photos per condolence message

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	location / {
		try_files $uri $uri/ =404;
	}

	location ~* \.(css|js|jpg|jpeg|png|svg|ico|otf|woff2?)$ {
		expires 7d;
		access_log off;
	}

	# Django: memorial pages, admin, Google login
	location ~ ^/(avis-de-deces|actualites|admin|accounts)(/|$) {
		proxy_pass http://gm_django;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
	}

	# ^~ : otherwise the *.css / *.jpg rule above wins and looks for these files in the website folder
	location ^~ /django-static/ {
		alias /srv/gm/data/static/;
		expires 7d;
	}

	# photos of private messages are only sent to the family by e-mail, never served
	location ^~ /media/messages/prive/ {
		return 404;
	}

	location ^~ /media/ {
		alias /srv/gm/data/media/;
		expires 7d;
	}
}
