# /etc/nginx/sites-available/gm-prod  (installed by deploy-prod.sh, next to the beta's "gm" site)
#
# The public site, www.gmfuneraire.fr: the `redesign` branch as plain files, the same pages S3 served.
# Only the contact form reaches Django. Everything else in Django (memorials, news, quotes, admin, Google
# login) stays on the password-protected beta until its tests are done.
# gm_django is the upstream defined in the beta's site file.

server {
	listen 80;
	listen [::]:80;
	server_name gmfuneraire.fr www.gmfuneraire.fr;

	# certificate renewal
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://www.gmfuneraire.fr$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name gmfuneraire.fr;

	ssl_certificate /etc/letsencrypt/live/gmfuneraire.fr/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/gmfuneraire.fr/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	return 301 https://www.gmfuneraire.fr$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name www.gmfuneraire.fr;

	ssl_certificate /etc/letsencrypt/live/gmfuneraire.fr/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/gmfuneraire.fr/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /srv/gm/www-prod;
	index index.html;
	charset utf-8;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Strict-Transport-Security "max-age=15552000" always;

	location / {
		try_files $uri $uri/ =404;
	}

	location ~* \.(css|js|jpg|jpeg|png|svg|ico|otf|woff2?)$ {
		expires 7d;
		access_log off;
	}

	# the contact form, and nothing else from Django
	location = /contact/envoyer/ {
		client_max_body_size 64k;
		proxy_pass http://gm_django;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
	}
}
